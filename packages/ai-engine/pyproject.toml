[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptiq-ai-engine"
version = "0.1.0"
description = "AdaptIQ Python AI-Engine for psychometrics, memory extraction, spaced repetition, and risk forecasting"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "xgboost>=1.7.0",
    "shap>=0.41.0",
    "requests>=2.31.0"
]
